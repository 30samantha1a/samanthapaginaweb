<!DOCTYPE html>
<html lang="pt-br">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
        <title>blog</title>
        <style>
          header{
            background-color: #4B015E;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
          }

          main{
            background-color: #FFFFFF;
            color: #4B015E;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
          }

          img{
            width: 80px;
            height: 80px;
          }
          .artigo-autor {
            font-weight: bold;
          }
        </style>
    </head>
    <body>
      <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre 
          tecnologia e programação</p>
      </header>
        <main>
          <img src="imagem-blog-samantha.jpg" alt="Ícone quadrado de cantos arredondados representando tecnologia e educação. 
          O fundo é roxo escuro e no centro há a ilustração vetorial de um livro aberto na cor branca. 
          A página esquerda do livro exibe uma seta estilizada apontando para cima e para a direita, 
          enquanto a página direita traz conexões de circuito eletrônico.">
          <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">por: Samantha Rosa</p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da
              área da tecnologia.</p>
              <button>❤️ <span></span></button>
              <button>👍 <span></span></button>
          </div>

        </main>
    </body>
    <script>
      const botao = document.querySelector("button");
      botao.addEventListener("click", botaoClicado);

      function botaoClicado(){
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        texto.textContent++;
      }

    </script>
</html>
